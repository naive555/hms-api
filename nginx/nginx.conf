# Included inside nginx's http {} block (conf.d/default.conf).

# Per-client rate limit for login, to slow down password guessing.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream app {
  server app:8080;
}

server {
  listen 80;
  server_name _;

  server_tokens off;
  client_max_body_size 16k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  # above the app's HIS timeout (3s) plus DB time
  proxy_read_timeout 15s;

  location = /staff/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://app;
  }

  location / {
    proxy_pass http://app;
  }

  error_page 413 = @too_large;
  error_page 429 = @rate_limited;
  error_page 502 503 504 = @unavailable;

  location @too_large {
    default_type application/json;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"request body is too large"}}';
  }

  location @rate_limited {
    default_type application/json;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"too many requests, please try again later"}}';
  }

  location @unavailable {
    default_type application/json;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"service temporarily unavailable"}}';
  }
}
